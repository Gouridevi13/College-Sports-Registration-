{% extends "layout.html" %}

{% block content %}

<div class="form-container">

    <div class="form-icon">
        👤
    </div>

    <h1>
        Create Account
    </h1>

    <p class="form-subtitle">
        Register to participate in college sports
    </p>

    <form method="POST">

        <label>
            Full Name
        </label>

        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Choose a username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button
            type="submit"
            class="btn">
            Create Account
        </button>

    </form>

    <p class="form-footer">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login here
        </a>

    </p>

</div>

{% endblock %}
