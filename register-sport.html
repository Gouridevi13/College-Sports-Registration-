{% extends "layout.html" %}

{% block content %}

<div class="form-container">

    <div class="form-icon">
        🏆
    </div>

    <h1>
        Register for {{ sport['sport_name'] }}
    </h1>

    <div class="selected-sport">

        <p>
            <strong>Category:</strong>
            {{ sport['category'] }}
        </p>

        <p>
            <strong>Venue:</strong>
            {{ sport['venue'] }}
        </p>

    </div>

    <form method="POST">

        <label>
            Student ID
        </label>

        <input
            type="text"
            name="student_id"
            placeholder="Enter your student ID"
            required
        >

        <label>
            Course
        </label>

        <input
            type="text"
            name="course"
            placeholder="Example: B.Tech CSE"
            required
        >

        <label>
            Year
        </label>

        <select name="year" required>

            <option value="">
                Select Year
            </option>

            <option value="1st Year">
                1st Year
            </option>

            <option value="2nd Year">
                2nd Year
            </option>

            <option value="3rd Year">
                3rd Year
            </option>

            <option value="4th Year">
                4th Year
            </option>

        </select>

        <button
            type="submit"
            class="btn">
            Submit Registration
        </button>

    </form>

    <p class="form-footer">

        <a href="{{ url_for('sports') }}">
            ← Back to Sports
        </a>

    </p>

</div>

{% endblock %}
