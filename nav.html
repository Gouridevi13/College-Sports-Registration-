<nav class="navbar">

    <div class="logo">
        🏆 SportsHub
    </div>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('sports') }}">
            Sports
        </a>

        {% if session.get('user_id') %}

            {% if session.get('role') == 'admin' %}

                <a href="{{ url_for('admin_registrations') }}">
                    Manage Registrations
                </a>

                <a href="{{ url_for('add_sport') }}">
                    Add Sport
                </a>

            {% else %}

                <a href="{{ url_for('my_registrations') }}">
                    My Registrations
                </a>

            {% endif %}

            <span class="welcome">
                Hi, {{ session.get('name') }}
            </span>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        {% else %}

            <a href="{{ url_for('login') }}">
                Login
            </a>

            <a href="{{ url_for('register') }}">
                Register
            </a>

        {% endif %}

    </div>

</nav>
