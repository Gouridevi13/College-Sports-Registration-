{% extends "layout.html" %}

{% block content %}

<div class="form-container">

    <div class="form-icon">
        🔐
    </div>

    <h1>
        Login
    </h1>

    <p class="form-subtitle">
        Login to your SportsHub account
    </p>

    <form method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button
            type="submit"
            class="btn">
            Login
        </button>

    </form>

    <p class="form-footer">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register here
        </a>

    </p>

</div>

{% endblock %}
