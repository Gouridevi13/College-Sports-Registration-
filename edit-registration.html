{% extends "layout.html" %}

{% block content %}

<div class="form-container">

    <div class="form-icon">
        ✏️
    </div>

    <h1>Edit Registration</h1>

    <p class="form-subtitle">
        Correct your registration details below.
    </p>

    <form method="POST">

        <label>
            Sport
        </label>

        <input
            type="text"
            value="{{ registration['sport_name'] }}"
            readonly
        >

        <label>
            Student ID
        </label>

        <input
            type="text"
            name="student_id"
            value="{{ registration['student_id'] }}"
            required
        >

        <label>
            Course
        </label>

        <input
            type="text"
            name="course"
            value="{{ registration['course'] }}"
            required
        >

        <label>
            Year
        </label>

        <select name="year" required>

            <option value="1" {% if registration['year'] == '1' %}selected{% endif %}>
                1st Year
            </option>

            <option value="2" {% if registration['year'] == '2' %}selected{% endif %}>
                2nd Year
            </option>

            <option value="3" {% if registration['year'] == '3' %}selected{% endif %}>
                3rd Year
            </option>

            <option value="4" {% if registration['year'] == '4' %}selected{% endif %}>
                4th Year
            </option>

        </select>

        <button type="submit" class="btn">
            Save Changes
        </button>

    </form>

    <p class="form-footer">

        <a href="{{ url_for('my_registrations') }}">
            ← Back to My Registrations
        </a>

    </p>

</div>

{% endblock %}
